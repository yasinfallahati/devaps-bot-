<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="DevOps Bot">
  <defs>
    <linearGradient id="bg5783189" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="acc5783189" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E">
        <animate attributeName="stop-color" values="#F43F5E;#FB7185;#F43F5E" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FB7185">
        <animate attributeName="stop-color" values="#FB7185;#F43F5E;#FB7185" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow5783189" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="200" rx="16" fill="url(#bg5783189)"/>
  <!-- circuit grid -->
  <g opacity="0.18" stroke="#F43F5E" stroke-width="1" fill="none">
    <path d="M40 40 H220 V90 H120 V150 H280"/>
    <path d="M620 50 H860 V110 H740 V160 H820"/>
    <circle cx="120" cy="90" r="3" fill="#FB7185"/>
    <circle cx="280" cy="150" r="3" fill="#F43F5E"/>
    <circle cx="740" cy="110" r="3" fill="#FB7185"/>
  </g>
  <!-- pulsing orbit -->
  <g transform="translate(820,100)">
    <circle r="36" fill="none" stroke="#F43F5E" stroke-width="1.5" opacity="0.35">
      <animate attributeName="r" values="28;40;28" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.15;0.45" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="8" fill="#FB7185" filter="url(#glow5783189)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 -28;0 -28" additive="sum" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#F43F5E" opacity="0.9"/>
  </g>
  <!-- accent bar -->
  <rect x="40" y="168" width="180" height="3" rx="2" fill="url(#acc5783189)">
    <animate attributeName="width" values="120;220;120" dur="4s" repeatCount="indefinite"/>
  </rect>
  <!-- title -->
  <text x="48" y="78" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial" font-size="36" font-weight="700" fill="#F8FAFC">DevOps Bot</text>
  <text x="48" y="118" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial" font-size="16" fill="#94A3B8">AI DevOps / server assistant UI</text>
  <!-- scan line -->
  <rect x="0" y="0" width="900" height="2" fill="#FB7185" opacity="0.25">
    <animate attributeName="y" values="0;200;0" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>
