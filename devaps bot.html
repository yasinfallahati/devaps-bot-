<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nibero Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0c0e16;
    --bg-side: #11131c;
    --bg-panel: #1a1d2b;
    --bg-input: #1c1f2e;
    --line: #262a3b;
    --text: #e7e9f3;
    --text-dim: #8890a6;
    --accent: #6c63ff;
    --accent-hover: #7d75ff;
    --ok: #3ddc84;
    --err: #ff5d6c;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Vazirmatn', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);font-family:var(--sans);color:var(--text);}
  body{display:flex;height:100vh;overflow:hidden;}

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:280px; flex-shrink:0; background:var(--bg-side);
    border-left:1px solid var(--line);
    display:flex; flex-direction:column;
    transition:margin-right .2s ease;
  }
  #sidebar.collapsed{ margin-right:-280px; }
  .side-top{ padding:20px 18px 14px; }
  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .brand .mark{
    width:30px;height:30px;border-radius:9px;
    background:linear-gradient(135deg, var(--accent), #a78bfa);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;
  }
  .brand .name{font-weight:800; font-size:17px; letter-spacing:-.2px;}
  #newchat-btn{
    width:100%; background:var(--accent); color:#fff; border:none;
    padding:11px 14px; border-radius:10px; font-family:var(--sans); font-weight:700; font-size:14px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  #newchat-btn:hover{ background:var(--accent-hover); }
  #convlist{ flex:1; overflow-y:auto; padding:6px 12px; display:flex; flex-direction:column; gap:4px; }
  .conv-item{
    display:flex; align-items:center; gap:8px;
    padding:10px 12px; border-radius:9px; cursor:pointer;
    font-size:13.5px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    border:1px solid transparent;
  }
  .conv-item:hover{ background:#181b29; color:var(--text); }
  .conv-item.active{ background:#1d2030; color:var(--text); border-color:var(--line); }
  .conv-item .del{ margin-right:auto; opacity:0; font-size:13px; flex-shrink:0; }
  .conv-item:hover .del{ opacity:0.6; }
  .conv-item .del:hover{ opacity:1; color:var(--err); }
  .side-bottom{ padding:14px 18px; border-top:1px solid var(--line); }
  #keybtn{
    width:100%; background:var(--bg-panel); border:1px solid var(--line); color:var(--text-dim);
    padding:9px 12px; border-radius:9px; font-family:var(--mono); font-size:11.5px; cursor:pointer;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  #keybtn:hover{ color:var(--text); border-color:var(--accent); }
  .keydot{ width:7px;height:7px;border-radius:50%; background:var(--err); }
  .keydot.on{ background:var(--ok); }

  /* ---------- Main ---------- */
  #main{ flex:1; display:flex; flex-direction:column; min-width:0; position:relative; }
  header{
    padding:16px 26px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:12px; background:var(--bg);
  }
  #sidebar-toggle{
    background:none; border:1px solid var(--line); color:var(--text-dim);
    width:34px; height:34px; border-radius:9px; cursor:pointer; font-size:15px;
  }
  #sidebar-toggle:hover{ color:var(--text); border-color:var(--accent); }
  header h1{ font-size:16.5px; font-weight:800; margin:0; }
  .status-dot{ width:8px;height:8px;border-radius:50%; background:var(--ok); box-shadow:0 0 8px var(--ok); }

  main#chat{
    flex:1; overflow-y:auto; padding:26px 26px 10px;
    display:flex; flex-direction:column; gap:18px;
    max-width:880px; width:100%; margin:0 auto;
  }
  .msg{ display:flex; gap:12px; }
  .msg .avatar{
    flex-shrink:0; width:32px; height:32px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--sans); font-size:13px; font-weight:800; color:#fff;
  }
  .msg.bot .avatar{ background:linear-gradient(135deg, var(--accent), #a78bfa); }
  .msg.user .avatar{ background:#2b2f42; color:var(--text); }
  .bubble{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:14px;
    padding:14px 17px; line-height:1.9; font-size:14.5px;
    white-space:pre-wrap; word-break:break-word; max-width:100%;
  }
  .msg.user .bubble{ background:#181b2a; }
  .bubble img.attach{ max-width:280px; border-radius:10px; display:block; margin-bottom:8px; border:1px solid var(--line); }
  .bubble .filechip{
    display:inline-flex; align-items:center; gap:6px; background:#0f1119; border:1px solid var(--line);
    padding:6px 10px; border-radius:8px; font-family:var(--mono); font-size:12px; color:var(--text-dim); margin-bottom:8px;
  }
  .bubble code{ font-family:var(--mono); font-size:13px; background:#0a0c14; padding:2px 6px; border-radius:4px; color:#ffc880; direction:ltr; display:inline-block; }
  .bubble pre{ font-family:var(--mono); font-size:13px; background:#0a0c14; border:1px solid var(--line); padding:14px; border-radius:10px; overflow-x:auto; direction:ltr; text-align:left; margin:8px 0; color:#9fd9ff; }

  .empty-state{ margin:auto; text-align:center; color:var(--text-dim); padding:40px; }
  .empty-state .mark-big{
    width:54px;height:54px;border-radius:16px; margin:0 auto 16px;
    background:linear-gradient(135deg, var(--accent), #a78bfa);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:#fff;
  }
  .empty-state .big{ font-family:var(--sans); font-size:19px; color:var(--text); font-weight:800; margin-bottom:8px; }
  .empty-state .small{ font-size:13px; line-height:2; }

  footer{ padding:14px 26px 22px; }
  #attach-preview{
    max-width:880px; margin:0 auto 8px; display:flex; gap:8px; flex-wrap:wrap;
  }
  .attach-chip{
    display:flex; align-items:center; gap:8px; background:var(--bg-panel); border:1px solid var(--line);
    padding:6px 10px; border-radius:9px; font-family:var(--mono); font-size:12px; color:var(--text-dim);
  }
  .attach-chip img{ width:24px; height:24px; border-radius:5px; object-fit:cover; }
  .attach-chip .rm{ cursor:pointer; color:var(--err); margin-right:4px; }

  #composer{
    max-width:880px; margin:0 auto; display:flex; gap:10px; align-items:flex-end;
    background:var(--bg-input); border:1px solid var(--line); border-radius:14px; padding:8px 8px 8px 10px;
  }
  #filebtn{
    flex-shrink:0; width:38px; height:38px; border-radius:10px; border:none; cursor:pointer;
    background:var(--accent); color:#fff; font-size:16px; display:flex; align-items:center; justify-content:center;
  }
  #filebtn:hover{ background:var(--accent-hover); }
  #userinput{
    flex:1; resize:none; background:transparent; border:none; outline:none;
    color:var(--text); font-family:var(--sans); font-size:14.5px; padding:9px 4px; max-height:160px; min-height:24px;
  }
  #sendbtn{
    flex-shrink:0; background:var(--accent); color:#fff; border:none; font-weight:700;
    font-family:var(--sans); font-size:13.5px; padding:0 18px; height:38px; border-radius:10px; cursor:pointer;
  }
  #sendbtn:disabled{ background:#2b2f42; color:var(--text-dim); cursor:not-allowed; }
  #sendbtn:hover:not(:disabled){ background:var(--accent-hover); }

  .thinking{ display:flex; gap:5px; align-items:center; padding:4px 0; }
  .thinking span{ width:5px;height:5px;border-radius:50%; background:var(--accent); animation:pulse 1.1s infinite ease-in-out; }
  .thinking span:nth-child(2){ animation-delay:0.15s; }
  .thinking span:nth-child(3){ animation-delay:0.3s; }
  @keyframes pulse{ 0%,80%,100%{opacity:.25;transform:scale(.8);} 40%{opacity:1;transform:scale(1.15);} }

  #chat::-webkit-scrollbar, #convlist::-webkit-scrollbar{ width:7px; }
  #chat::-webkit-scrollbar-thumb, #convlist::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }

  /* Settings modal */
  #modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6); display:none;
    align-items:center; justify-content:center; z-index:50;
  }
  #modal-overlay.show{ display:flex; }
  #modal{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:14px; padding:24px;
    width:90%; max-width:420px;
  }
  #modal h2{ margin:0 0 6px; font-size:16px; }
  #modal p{ color:var(--text-dim); font-size:12.5px; margin:0 0 16px; line-height:1.8; }
  #modal-key{
    width:100%; background:var(--bg-input); border:1px solid var(--line); color:var(--text);
    font-family:var(--mono); font-size:13px; padding:10px 12px; border-radius:9px; outline:none; margin-bottom:14px;
  }
  #modal-key:focus{ border-color:var(--accent); }
  .modal-actions{ display:flex; gap:10px; }
  .modal-actions button{
    flex:1; padding:10px; border-radius:9px; border:none; font-family:var(--sans); font-weight:700; cursor:pointer; font-size:13.5px;
  }
  #modal-save{ background:var(--accent); color:#fff; }
  #modal-save:hover{ background:var(--accent-hover); }
  #modal-cancel{ background:transparent; color:var(--text-dim); border:1px solid var(--line) !important; }

  @media (max-width:760px){
    #sidebar{ position:fixed; z-index:40; height:100%; }
    #sidebar.collapsed{ margin-right:-280px; }
  }
</style>
</head>
<body>

<aside id="sidebar">
  <div class="side-top">
    <div class="brand"><div class="mark">N</div><div class="name">Nibero</div></div>
    <button id="newchat-btn">+ گفتگوی جدید</button>
  </div>
  <div id="convlist"></div>
  <div class="side-bottom">
    <button id="keybtn"><span id="keybtn-label">تنظیم کلید API</span><span class="keydot" id="keydot"></span></button>
  </div>
</aside>

<div id="main">
  <header>
    <button id="sidebar-toggle">☰</button>
    <h1>هوش مصنوعی Nibero</h1>
    <span class="status-dot"></span>
  </header>

  <main id="chat"></main>

  <footer>
    <div id="attach-preview"></div>
    <div id="composer">
      <input type="file" id="filein" multiple style="display:none" accept="image/*,.txt,.js,.py,.json,.log,.csv,.md,.html,.css,.java,.c,.cpp,.cs,.php,.ts,.go,.rb">
      <button id="filebtn" title="پیوست فایل">📎</button>
      <textarea id="userinput" placeholder="پیام خود را اینجا بنویسید..." rows="1"></textarea>
      <button id="sendbtn">ارسال</button>
    </div>
  </footer>
</div>

<div id="modal-overlay">
  <div id="modal">
    <h2>کلید API چت‌جی‌پی‌تی</h2>
    <p>کلید فقط در همین مرورگر شما (localStorage) ذخیره می‌شود و به جای دیگری ارسال نمی‌شود.</p>
    <input id="modal-key" type="password" placeholder="sk-...">
    <div class="modal-actions">
      <button id="modal-save">ذخیره</button>
      <button id="modal-cancel">انصراف</button>
    </div>
  </div>
</div>

<script>
const SYSTEM_PROMPT = `تو دستیار هوشمند Nibero هستی، یک دستیار همه‌کاره که قدرتش از ChatGPT گرفته شده. در کنار پاسخ‌گویی عمومی، در تحلیل کد، رفع باگ، بررسی پیام‌های خطا و لاگ‌های سیستمی تخصص بالایی داری.
قوانین:
1. همیشه به فارسی پاسخ بده مگر کاربر زبان دیگری بخواهد.
2. وقتی کاربر کد، خطا یا فایل می‌فرستد: ابتدا علت احتمالی مشکل را خلاصه کن، سپس راه‌حل را با کد اصلاح‌شده در بلوک کد نشان بده.
3. اگر تصویری فرستاده شده، محتوای آن را تحلیل کن (مثلاً اسکرین‌شات خطا یا کد).
4. مختصر، دقیق و فنی باش.`;

const LS_CONV = 'nibero_conversations';
const LS_KEY = 'nibero_apikey';

let apiKey = localStorage.getItem(LS_KEY) || '';
let conversations = JSON.parse(localStorage.getItem(LS_CONV) || '[]');
let activeId = null;
let pendingAttachments = []; // {type:'image'|'file', name, dataUrl|text}

const chatEl = document.getElementById('chat');
const convlistEl = document.getElementById('convlist');
const inputEl = document.getElementById('userinput');
const sendBtn = document.getElementById('sendbtn');
const fileInput = document.getElementById('filein');
const attachPreview = document.getElementById('attach-preview');
const keydot = document.getElementById('keydot');
const keybtnLabel = document.getElementById('keybtn-label');

function saveConvs(){ localStorage.setItem(LS_CONV, JSON.stringify(conversations)); }
function updateKeyStatus(){
  if(apiKey){ keydot.classList.add('on'); keybtnLabel.textContent = 'کلید API متصل است'; }
  else { keydot.classList.remove('on'); keybtnLabel.textContent = 'تنظیم کلید API'; }
}

function newConversation(){
  const conv = { id: 'c'+Date.now(), title: 'گفتگوی جدید', messages: [], createdAt: Date.now() };
  conversations.unshift(conv);
  activeId = conv.id;
  saveConvs();
  renderConvList();
  renderChat();
}

function renderConvList(){
  convlistEl.innerHTML = '';
  conversations.forEach(conv => {
    const item = document.createElement('div');
    item.className = 'conv-item' + (conv.id === activeId ? ' active' : '');
    item.innerHTML = `<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(conv.title)}</span><span class="del" title="حذف">✕</span>`;
    item.addEventListener('click', (e) => {
      if(e.target.classList.contains('del')){
        conversations = conversations.filter(c => c.id !== conv.id);
        saveConvs();
        if(activeId === conv.id){
          activeId = conversations[0]?.id || null;
          if(!activeId) newConversation(); else renderChat();
        }
        renderConvList();
        return;
      }
      activeId = conv.id;
      renderConvList();
      renderChat();
    });
    convlistEl.appendChild(item);
  });
}

function escapeHtml(str){
  return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function renderContent(text){
  const parts = text.split(/```(\w*)\n([\s\S]*?)```/g);
  let html = '';
  for(let i=0;i<parts.length;i+=3){
    const plain = parts[i] || '';
    html += escapeHtml(plain).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\n/g,'<br>');
    if(parts[i+2] !== undefined){
      html += `<pre>${escapeHtml(parts[i+2])}</pre>`;
    }
  }
  return html;
}

function getActiveConv(){ return conversations.find(c => c.id === activeId); }

function renderChat(){
  chatEl.innerHTML = '';
  const conv = getActiveConv();
  if(!conv || conv.messages.length === 0){
    chatEl.innerHTML = `<div class="empty-state">
      <div class="mark-big">N</div>
      <div class="big">سلام! من Nibero هستم</div>
      <div class="small">می‌تونی متن، کد، خطا یا حتی عکس و فایل برام بفرستی<br>تاریخچهٔ گفتگوها به‌صورت خودکار ذخیره می‌مونه</div>
    </div>`;
    return;
  }
  conv.messages.forEach(m => addMessageEl(m.role, m.content, m.attachments || []));
  chatEl.scrollTop = chatEl.scrollHeight;
}

function addMessageEl(role, text, attachments=[]){
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'user' ? 'شما' : 'N';
  const bubbleWrap = document.createElement('div');
  bubbleWrap.style.flex = '1';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  let attachHtml = '';
  attachments.forEach(a => {
    if(a.type === 'image'){ attachHtml += `<img class="attach" src="${a.dataUrl}">`; }
    else { attachHtml += `<div class="filechip">📄 ${escapeHtml(a.name)}</div><br>`; }
  });
  bubble.innerHTML = attachHtml + renderContent(text);
  bubbleWrap.appendChild(bubble);
  wrap.appendChild(avatar);
  wrap.appendChild(bubbleWrap);
  chatEl.appendChild(wrap);
}

function addThinking(){
  const wrap = document.createElement('div');
  wrap.className = 'msg bot';
  wrap.id = 'thinkingMsg';
  wrap.innerHTML = `<div class="avatar">N</div><div class="bubble thinking"><span></span><span></span><span></span></div>`;
  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
}
function removeThinking(){ document.getElementById('thinkingMsg')?.remove(); }

/* ---------- File handling ---------- */
document.getElementById('filebtn').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', async () => {
  for(const file of fileInput.files){
    if(file.type.startsWith('image/')){
      const dataUrl = await readAsDataURL(file);
      pendingAttachments.push({ type:'image', name:file.name, dataUrl });
    } else {
      const text = await readAsText(file);
      pendingAttachments.push({ type:'file', name:file.name, text });
    }
  }
  fileInput.value = '';
  renderAttachPreview();
});
function readAsDataURL(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}
function readAsText(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsText(file);
  });
}
function renderAttachPreview(){
  attachPreview.innerHTML = '';
  pendingAttachments.forEach((a, idx) => {
    const chip = document.createElement('div');
    chip.className = 'attach-chip';
    chip.innerHTML = (a.type === 'image' ? `<img src="${a.dataUrl}">` : '📄') + `<span>${escapeHtml(a.name)}</span><span class="rm" data-idx="${idx}">✕</span>`;
    chip.querySelector('.rm').addEventListener('click', () => {
      pendingAttachments.splice(idx, 1);
      renderAttachPreview();
    });
    attachPreview.appendChild(chip);
  });
}

/* ---------- Sidebar toggle ---------- */
document.getElementById('sidebar-toggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('collapsed');
});
document.getElementById('newchat-btn').addEventListener('click', newConversation);

/* ---------- Settings modal ---------- */
const overlay = document.getElementById('modal-overlay');
document.getElementById('keybtn').addEventListener('click', () => {
  document.getElementById('modal-key').value = apiKey;
  overlay.classList.add('show');
});
document.getElementById('modal-cancel').addEventListener('click', () => overlay.classList.remove('show'));
document.getElementById('modal-save').addEventListener('click', () => {
  apiKey = document.getElementById('modal-key').value.trim();
  localStorage.setItem(LS_KEY, apiKey);
  updateKeyStatus();
  overlay.classList.remove('show');
});

/* ---------- Input handling ---------- */
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
});
inputEl.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
});
sendBtn.addEventListener('click', sendMessage);

async function sendMessage(){
  const text = inputEl.value.trim();
  if(!text && pendingAttachments.length === 0) return;
  if(!apiKey){
    overlay.classList.add('show');
    return;
  }
  if(!activeId) newConversation();
  const conv = getActiveConv();

  const attachmentsForStore = pendingAttachments.map(a => a.type === 'image'
    ? { type:'image', name:a.name, dataUrl:a.dataUrl }
    : { type:'file', name:a.name });

  conv.messages.push({ role:'user', content:text, attachments: attachmentsForStore });
  if(conv.messages.length === 1){
    conv.title = text.slice(0, 32) || (pendingAttachments[0]?.name ?? 'گفتگوی جدید');
  }
  saveConvs();
  renderConvList();
  renderChat();

  // Build API message content
  const contentParts = [];
  let fullText = text;
  pendingAttachments.forEach(a => {
    if(a.type === 'file'){
      fullText += `\n\n[فایل پیوست شده: ${a.name}]\n\`\`\`\n${a.text}\n\`\`\``;
    }
  });
  contentParts.push({ type:'text', text: fullText || '(بدون متن، فقط فایل پیوست)' });
  pendingAttachments.forEach(a => {
    if(a.type === 'image'){
      contentParts.push({ type:'image_url', image_url: { url: a.dataUrl } });
    }
  });

  const apiHistory = conv.messages.slice(0, -1).map(m => ({
    role: m.role,
    content: m.content || '(پیام بدون متن)'
  }));

  pendingAttachments = [];
  renderAttachPreview();
  inputEl.value = '';
  inputEl.style.height = 'auto';
  sendBtn.disabled = true;
  addThinking();

  try{
    const res = await fetch('https://api.openai.com/v1/chat/completions', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + apiKey },
      body: JSON.stringify({
        model: 'gpt-4o-mini',
        messages: [
          { role:'system', content: SYSTEM_PROMPT },
          ...apiHistory,
          { role:'user', content: contentParts }
        ],
        temperature: 0.4
      })
    });
    const data = await res.json();
    removeThinking();
    if(data.error){
      conv.messages.push({ role:'assistant', content:'⚠ خطا از سمت API: ' + (data.error.message || 'مشکل نامشخص') });
    } else {
      const reply = data.choices?.[0]?.message?.content || 'پاسخی دریافت نشد.';
      conv.messages.push({ role:'assistant', content: reply });
    }
    saveConvs();
    renderChat();
  }catch(err){
    removeThinking();
    conv.messages.push({ role:'assistant', content:'⚠ خطا در اتصال به API: ' + err.message });
    saveConvs();
    renderChat();
  }finally{
    sendBtn.disabled = false;
  }
}

/* ---------- Init ---------- */
updateKeyStatus();
if(conversations.length === 0){ newConversation(); }
else { activeId = conversations[0].id; renderConvList(); renderChat(); }
</script>
